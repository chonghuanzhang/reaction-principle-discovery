version: "3.0"

state_scores:
  support: 4
  conditional_support: 2
  contradiction: 0
  unknown: null

core_dimensions:
  - elementary_step_match
  - electrophile_state_match
  - reactive_state_accessibility
  - condition_compatibility
  - target_selectivity

critical_dimensions:
  - elementary_step_match
  - electrophile_state_match
  - reactive_state_accessibility

evidence_confidence_dimension: evidence_quality
failure_risk_dimension: competing_pathway_risk
risk_direction: adverse

ranking_weights:
  elementary_step_match: 1.4
  electrophile_state_match: 1.3
  reactive_state_accessibility: 1.3
  condition_compatibility: 1.0
  target_selectivity: 1.2
  competing_pathway_risk: 1.2
  evidence_quality: 0.8

ranking_weight_bounds:
  elementary_step_match: [0.8, 1.8]
  electrophile_state_match: [0.8, 1.7]
  reactive_state_accessibility: [0.8, 1.7]
  condition_compatibility: [0.6, 1.4]
  target_selectivity: [0.7, 1.6]
  competing_pathway_risk: [0.7, 1.7]
  evidence_quality: [0.5, 1.3]

ranking_sample_count: 256
ranking_stability_max_span: 0

evidence_aggregation_policy:
  positive: support
  conditional: conditional_support
  adverse: contradiction
  mixed: conditional_support
  none: unknown

seed_evidence_type_dimensions:
  reaction_center:
    - elementary_step_match
  reactive_intermediate:
    - reactive_state_accessibility
  electronic_requirement:
    - electrophile_state_match
  nucleophile_requirement:
    - reactive_state_accessibility
  catalyst_role:
    - condition_compatibility
  condition_window:
    - condition_compatibility
  selectivity:
    - target_selectivity
  failure_boundary:
    - competing_pathway_risk

priority_regions:
  priority_a:
    min_compatibility: 3.5
    min_evidence_confidence: 3.5
    max_uncertainty_burden: 0.25
    max_failure_risk: 1.0
  priority_b:
    min_compatibility: 3.0
    min_evidence_confidence: 2.0
    max_uncertainty_burden: 1.0
    max_failure_risk: 2.0
  priority_c:
    min_compatibility: 2.0
    min_evidence_confidence: 2.0
    max_uncertainty_burden: 2.0
    max_failure_risk: 3.0
  boundary: null
  excluded: null
  unknown: null
