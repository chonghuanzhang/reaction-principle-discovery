[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reaction-principle-literature-pilot"
version = "0.1.0"
description = "Evidence-grounded literature extraction for reaction-principle research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=45,<47",
  "pydantic>=2.13,<3",
  "pypdf>=6.10,<7",
  "PyYAML>=6.0,<7",
  "rdkit==2025.9.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "reportlab>=4.4,<5",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
