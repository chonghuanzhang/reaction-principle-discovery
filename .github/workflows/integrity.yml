name: Research data checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research tables and reader links
        run: python tools/check_data.py
      - name: Check current recommendation release
        run: |
          python code/scripts/validate_candidate_release.py
          python code/scripts/reproduce_mapping.py
          python code/scripts/reproduce_novelty.py
          python code/tests/test_reusable_skills.py -v
      - name: Verify complete experimental workbook
        run: python optimization/scripts/reassemble_workbook.py
      - name: Test current source-cell validation
        working-directory: optimization/scripts
        run: python -m unittest -v test_source_workbook
      - name: Check source-specific rule evaluator
        working-directory: code/evaluation/local_rules
        run: python -m unittest -v test_conditional_rules.py
      - name: Install numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Check current Bayesian recommendation engine
        working-directory: optimization/current
        run: python -m unittest -v test_engine
      - name: Verify recorded Bayesian campaigns
        run: python optimization/current/verify_recorded_campaign.py --output /tmp/current-campaign-verification
      - name: Check current response provenance against the source workbook
        run: python optimization/scripts/check_data.py --output /tmp/current-source-data-check.json
