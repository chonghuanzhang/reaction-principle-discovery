name: Research data checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research tables and reader links
        run: python tools/check_data.py
      - name: Verify complete experimental workbook
        run: python optimization/scripts/reassemble_workbook.py
      - name: Install numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Check Bayesian selection policy
        working-directory: optimization/benchmark
        run: python -m unittest -v test_policy
